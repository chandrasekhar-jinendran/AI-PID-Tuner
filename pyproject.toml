[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pid-tuner"
version = "1.0.0"
description = "AI-assisted PID controller tuner with MCP integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["pid", "control-systems", "mcp", "tuning", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "mcp>=1.0",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pid-tuner-mcp = "pid_tuner.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pid_tuner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pid_tuner --cov-report=term-missing -v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
